<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitLab プレビュー</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_/preview.css">
<script id="gp-libs" type="application/json">{{LIBS}}</script>
<script id="gp-config" type="application/json">{{CONFIG}}</script>
<script src="_/preview.js" defer></script>
</head>
<body>
<header id="gp-header">
  <span id="gp-file"></span>
  <span id="gp-mode"></span>
  <div id="gp-controls">
    <label>配色 <select id="gp-theme" aria-label="プレビューの配色">
      <option value="system">システム</option>
      <option value="light">ライト</option>
      <option value="dark">ダーク</option>
    </select></label>
    <label>本文幅 <select id="gp-width" aria-label="プレビューの本文幅">
      <option value="fluid">全幅</option>
      <option value="fixed">固定幅</option>
    </select></label>
  </div>
</header>
<div id="gp-banner" role="status" hidden></div>
<div id="gp-page" class="file-holder">
  <main id="gp-content" class="file-content js-markup-content md">読み込み中…</main>
</div>
</body>
</html>
